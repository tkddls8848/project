<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nara Crawler Control</title>
    <link rel="stylesheet" href="/static/styles.css?v=1" />
  </head>
  <body>
    <main class="shell">
      <header class="top-band">
        <div class="brand">
          <span class="brand-mark">C</span>
          <div>
            <h1>공공데이터 크롤러 제어</h1>
            <p id="healthText">상태 확인 중</p>
          </div>
        </div>
        <div class="storage-chips" id="storageChips"></div>
      </header>

      <div class="body-grid">
        <section class="panel">
          <h2>실행</h2>

          <fieldset class="field">
            <legend>대상</legend>
            <label class="radio">
              <input type="radio" name="mode" value="type" checked />
              <span>타입·범위 지정</span>
            </label>
            <label class="radio">
              <input type="radio" name="mode" value="full" />
              <span>전체 크롤 (CSV 전 범위, 오래 걸림)</span>
            </label>
            <label class="radio">
              <input type="radio" name="mode" value="depth" />
              <span>심화 단계만 (저장된 문서 재분석)</span>
            </label>
          </fieldset>

          <div id="typeFields">
            <label class="field">
              <span>타입</span>
              <select id="typeInput"></select>
            </label>

            <div class="field range-field">
              <span>문서번호 범위</span>
              <div class="range-inputs">
                <input id="startInput" type="number" min="0" placeholder="시작" />
                <span class="dash">–</span>
                <input id="endInput" type="number" min="0" placeholder="끝" />
                <button type="button" id="rangeButton" class="ghost">CSV 범위 조회</button>
              </div>
              <small id="rangeHint" class="hint"></small>
            </div>
          </div>

          <label class="field">
            <span>워커 수 <small class="hint">비우면 타입별 기본값</small></span>
            <input id="workersInput" type="number" min="1" max="64" placeholder="기본값" />
          </label>

          <fieldset class="field">
            <legend>목록 CSV</legend>
            <label class="check">
              <input type="checkbox" id="skipUpdateInput" />
              <span>갱신 확인 건너뛰기</span>
            </label>
            <label class="check">
              <input type="checkbox" id="forceUpdateInput" />
              <span>CSV 강제 재다운로드</span>
            </label>
          </fieldset>

          <fieldset class="field danger">
            <legend>심화 단계 <span class="badge">외부 요청 발생</span></legend>
            <label class="check">
              <input type="checkbox" id="deepInput" />
              <span>파일 샘플 수신 + 스키마·품질·주소 리포트</span>
            </label>
            <label class="check indent">
              <input type="checkbox" id="fullDownloadInput" disabled />
              <span>전량 수신 (포털 부하가 큽니다)</span>
            </label>
            <label class="check">
              <input type="checkbox" id="harvestInput" />
              <span>LINK 문서의 기관 포털 수집</span>
            </label>
            <label class="check indent">
              <span>최대 호스트 수</span>
              <input id="harvestHostsInput" type="number" min="1" max="50" value="4" class="tiny" />
            </label>
          </fieldset>

          <div class="command-preview">
            <span class="label">실행될 명령</span>
            <code id="commandPreview">—</code>
            <p id="previewError" class="error hidden"></p>
          </div>

          <div class="actions">
            <button type="button" id="startButton">크롤 시작</button>
            <button type="button" id="stopButton" class="danger-button" disabled>중단</button>
          </div>
        </section>

        <section class="panel">
          <h2>진행</h2>
          <div class="run-state">
            <span id="runBadge" class="badge idle">대기</span>
            <span id="runCommand" class="run-command"></span>
          </div>
          <div class="progress-wrap">
            <div class="progress-head">
              <span id="progressLabel">진행 중인 작업 없음</span>
              <span id="progressCount"></span>
            </div>
            <progress id="progressBar" max="100" value="0"></progress>
          </div>
          <pre id="logBox" class="log" aria-live="polite">크롤을 시작하면 로그가 여기에 표시됩니다.</pre>

          <h2>최근 크롤</h2>
          <div id="recentList" class="recent">기록을 불러오는 중</div>
        </section>
      </div>
    </main>
    <script src="/static/app.js?v=1"></script>
  </body>
</html>
